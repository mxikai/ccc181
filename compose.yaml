services:
  db:
    image: postgres:17
    container_name: cleanq-db
    environment:
      POSTGRES_USER: cleanq
      POSTGRES_PASSWORD: katemikee8
      POSTGRES_DB: cleanq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanq -d cleanq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: